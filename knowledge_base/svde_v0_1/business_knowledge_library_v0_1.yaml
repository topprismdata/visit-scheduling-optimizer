# SVDE Knowledge Base v0.1 — Business Knowledge Library (Candidate Layer)
## Knowledge Expansion Phase · Task A（Step 1/3）· Knowledge Builder 角色
## 来源纪律：Evidence ≠ Design —— 本文件全部为 Candidate Knowledge Package，零修改 Frozen KB

version: SVDE-KB-BusinessKnowledge-v0.1
generated_at: "2026-08-22"
role_note: "Knowledge Auditor → Knowledge Builder 切换（评审指令 2026-08-22）；本库为业务知识资产层，与 Frozen 五层（ontology/governance/backend/evidence/DM/scenario）隔离"

pipeline:            # 六段流水（每条 entry 均按此登记）
  - Evidence Extraction      # 仅从一手核验源提取可直引 claim
  - Semantic Classification  # A01 二维矩阵: source_authority × claim_type
  - Concept Candidate        # 三问裁定: 既有可表达→复用 / 否则→candidate(等场景)
  - Decision Mapping         # 指向既有 8 DM；新 Decision 仅登记候选映射，不建 DM
  - Scenario Mapping         # 指向既有 5 场景或标注"缺口——待未来场景"；不新建场景

discipline:
  - "不因发现新概念立即进入 Frozen Ontology（本文件 concept_candidate 均为 Candidate 态）"
  - "不复制厂商对象（提取的是业务实践/决策问题/业务约束，非 SF/SAP/PTV 数据模型）"
  - "所有知识保留来源（source_id → A01 Registry 25 项 / 内部验证报告 / 同行评审 DOI）"
  - "所有 Candidate 等待 Scenario 验证后才可迁移"

