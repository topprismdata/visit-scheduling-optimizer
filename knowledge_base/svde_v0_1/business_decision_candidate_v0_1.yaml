    - {decision: BDC-07 Exception, patterns: [未安排惩罚项, 字典序分层]}
    - {decision: NDC-01 Territory, patterns: [Partitioning, Location-Allocation, 紧凑 MIP]}
    - {decision: NDC-03 WorkloadBalance, patterns: [Min-Max, Variance, Range-band, Lexicographic]}
