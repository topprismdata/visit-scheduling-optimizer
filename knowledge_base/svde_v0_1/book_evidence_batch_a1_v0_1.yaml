entries:

  - id: BE-018
    source: {book: source_book, page: "p218"}
    author: Zoltners, Sinha & Lorimer
    year: 2004
    type: {authority: PEER_REVIEWED_RESEARCH_comparable(学术型专著), claim: DOMAIN_PRACTICE}
    business_topic: 规模→覆盖→销售因果链
    claim: "'sales force effort drives sales'——作者明确指出因果方向是销售投入驱动销售（而非销售驱动投入），并引 Fortune 50 CEO 误读因果的案例；规模决策先于覆盖决策"
    supports:
      concept_candidate: [复用→ResourceAvailability/SalesResource（能力面）+ ExecutionHistory（投入面）]
      decision_candidate: [决策链证据: DM-004 ResourceAlloc(投入) → DM-001 Coverage(覆盖) → 销售结果——三 DM 的业务因果序]
    confidence: B
    scenario_mapping: 已有间接背书（S-A TA-CAP 容量→准入链）；因果链本身是 Decision Mapping 层知识，无需新场景

  - id: BE-019
    source: {book: source_book, page: "p242-243"}
    author: 同上
    year: 2004
    type: {authority: 专著方法, claim: DOMAIN_PRACTICE}
    business_topic: 活动法规模测算（Activity-based Sizing）
    claim: "活动法三步：'developing a list of sales force activities required to cover the accounts in each customer segment, estimating the time it takes for a salesperson to complete these activities, then calculating the number of salespeople required to do the work'——按活动×时间×覆盖目标算人力"
    supports:
      concept_candidate: [复用→ResourceDayProfile.capacity_min × VisitDemand.expected_duration_min × FrequencySpec——契约三对象即活动法的数据要件]
      decision_candidate: [Sales Capacity Decision（战略级规模）——当前边界外；战术级同构=DM-004 已验（S-A/D/B 容量判定口径一致）]
    confidence: B
    scenario_mapping: 战术同构已验；战略级规模场景=G-4 未开——本条为 CC-02 战略层提供方法证据（与 BE-009 ORTEC 分层互证）

  - id: BE-020
    source: {book: source_book, page: "p229-237"}
    author: 同上
    year: 2004
    type: {authority: 专著方法, claim: DOMAIN_PRACTICE}
    business_topic: 规模健康五快测
    claim: "五个快速判断规模是否合适的测试：customer test（客户答不出'我的销售是谁'/久未见面/考虑更换供应商=过小信号）、morale test、selling activities test、competitive position test、financial test——规模失衡以客户可感知信号先行暴露"
    supports:
      concept_candidate: [复用→ExecutionHistory.missed + VisitCandidate.priority_score（客户侧信号=监测输入）]
      decision_candidate: [DM-008 ExecutionMonitor 的战略层输入形态——覆盖不足的早期信号定义]
    confidence: B
    scenario_mapping: S-B 偏离 diff 已验机制同构；customer test 语义（客户感知）属战略层——随 G-4

  - id: BE-021
    source: {book: source_book, page: "p271"}
    author: 同上
    year: 2004
    type: {authority: 专著定义, claim: DOMAIN_PRACTICE}
    business_topic: 辖区对齐定义（Territory Alignment）
    claim: "'The assignment of accounts and their associated selling activities to salespeople and teams is called sales territory alignment'——对齐=客户账户+其销售活动到销售人员的指派（别名 assignment/deployment/districting）"
    supports:
      concept_candidate: [复用→战略层的 Ownership(账户归属)+Assignment(活动指派)——与 S-D 已验的 Ownership≠Assignment 同构放大：专著在战略层同样把'归属'与'活动'作为对齐的两要素]
      decision_candidate: [CC-02 TerritoryDesign 的权威定义证据——辖区设计决策=账户×活动的批量指派决策]
    confidence: A    # 领域权威专著的可直引定义
    scenario_mapping: 战术级同构已验（S-D MRE-D-1 五要素链）；战略级=G-4——本条显著强化 CC-02（从'文献存在'升级为'权威定义+方法体系'）

  - id: BE-022
    source: {book: source_book, page: "p269-270"}
    author: 同上
    year: 2004
    type: {authority: 专著案例, claim: EMPIRICAL_EVIDENCE}
    business_topic: 对齐失衡的双向症状
    claim: "Chicago 辖区销售领先但'prospective customers have never been contacted'且存量客户服务不足；Indianapolis 辖区'market share 领先'但高流失——同等人力下对齐失准同时制造覆盖缺口与过劳/激励不公两种症状"
    supports:
      concept_candidate: [复用→FulfillmentClass(覆盖分层) + CC-03 WorkloadEquity(负荷/潜力失衡)]
      decision_candidate: [DM-001 覆盖 与 DM-004 容量 的耦合失衡证据——单侧优化任一者都不够]
    confidence: B
    scenario_mapping: 单场景内耦合已验（S-A TA-CAP 容量压力→分层准入）；跨辖区均衡=G-5 未验

  - id: BE-023
    source: {book: source_book, page: "p291-293"}
    author: 同上
    year: 2004
    type: {authority: 专著方法, claim: DOMAIN_PRACTICE}
    business_topic: 对齐目标（经济学口径）
    claim: "四大对齐目标之首：'Equalizing marginal returns is the objective preferred by economists'——稀缺销售投入的利润最大化发生在各输入边际回报相等时（报酬递减律）；其余目标含潜力分布公平（'rules that define an acceptable range of territory'潜力区间规则）"
    supports:
      concept_candidate: [复用→DM-002 Prioritization 的经济学基础（与 BE-004 逾期累积/BE-007 Size-of-Prize 同族：边际回报口径）+ CC-03 的'区间带'形态（潜力可接受区间=公平带）]
      decision_candidate: [战略层 ResourceAlloc 目标函数语义——candidate 映射（不建 DM）]
    confidence: A
    scenario_mapping: 战术同构（priority_score 排序=离散版边际回报均衡）；战略级目标形态=G-4/G-5

  - id: BE-024
    source: {book: source_book, page: "p294-298"}
    author: 同上
    year: 2004
    type: {authority: 专著方法, claim: DOMAIN_PRACTICE}
    business_topic: 扰动管理（Manage Disruption）
    claim: "对齐规则二'Manage Disruption'：重排破坏销售员客户关系（'a single account between territories is seen by one salesperson as losing the best account and by the other as gaining the worst'）；实证跟踪重排后 test 组（换人账户）vs control 组（未换）销售差异，支持完整账户交接程序；过渡期双账户计酬（'paid based on sales performance at both his or her old accounts and his or her new accounts for a period following realignment'）"
    supports:
      concept_candidate: [复用→PlanningPolicy.freeze_days_count + max_reassignment_ratio + ExistingCommitment——战略层与运营层共享'最小破坏'语义；过渡期计酬=重排补偿策略（策略配置）]
      decision_candidate: [DM-006+DM-007（H2 合并裁定）的**跨层语义证据**：专著在战略重排场景同样采用'冻结+限扰动+补偿'三件套，与 S-E/S-B 运营层实证同构]
    confidence: A
    scenario_mapping: 运营层已验（S-E 17/17 freeze/ratio/承诺存活）；本条证明该语义非运营层特有——跨层复用证据（无新概念需求）
    note: "BE-011(Sethi&Serger) + BE-024(Zoltners) + S-E 实证三源互证：稳定性语义在理论/专著/场景三层一致"

  - id: BE-025
    source: {book: source_book, page: "p299-300"}
    author: 同上
    year: 2004
    type: {authority: 专著方法, claim: DOMAIN_PRACTICE}
    business_topic: 激励与对齐的交互
    claim: "对齐规则三'Manage Incentive Compensation Issues'：销量导向激励使销售员'want more accounts than they can cover effectively'（贪多），市场份额导向使'them to want fewer accounts than they could manage'（贪少）——激励结构系统性扭曲账户需求申报"
    supports:
      concept_candidate: [复用→需求侧失真证据：VisitDemand 生成需独立于资源侧自报（DemandReason 显式化=防申报失真）——契约'需求与资源分离'设计的业务理由]
      decision_candidate: [DM-003 ReqGeneration 的独立性佐证：需求物化不能被资源侧偏好污染]
    confidence: B
    scenario_mapping: 契约已按此原则冻结（demand/policy 分离）；无新场景需求

  - id: BE-026
    source: {book: source_book, page: "p290"}
    author: 同上
    year: 2004
    type: {authority: 专著方法, claim: DOMAIN_PRACTICE}
    business_topic: 重对齐触发条件
    claim: "产品组合变化即使规模不变也改变'workload and sales potential across various sales territories'的分布——'Companies stand to lose significant sales and profits if they do not reexamine...alignments'；列举八类触发（结构调整/增员/减员/并购/市场变化/新建/新品）"
    supports:
      concept_candidate: [复用→S-E 滚动重排的战略层触发器集合——触发器=执行事件流的战略级扩展（ExecutionHistory 概念族）]
      decision_candidate: [DM-008 监测的触发维度证据（何時该重排的战略级信号）]
    confidence: B
    scenario_mapping: 战术触发已验（S-E 扰动包/S-B 四事件）；战略触发集合=G-4

