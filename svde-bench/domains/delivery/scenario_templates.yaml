# SVDE-Bench v0.2 — Delivery Scenario Templates (Expanded for D01-D10 Generation)
# Defines 10 differentiated scenario variants across the 5 Delivery Decision Patterns (2 per pattern)

domain: "delivery"
version: "1.0"

templates:
  # ==========================================
  # Pattern D1: VIP SLA Commitment Protection
  # ==========================================
  - case_code: "D01"
    pattern_id: "PATTERN-D1-VIP-SLA-PROTECTION"
    variant_name: "Cost Pressure Under Fixed Fleet"
    decision_dilemma: "Tight fleet budget temptations to consolidate VIP stop into longer route, risking locked window breach."
    intent:
      primary_objective: "maximize_vip_commitment_fulfillment"
      secondary_objectives: ["minimize_overtime_cost"]
      priority_rules:
        vip_customer: "high"
        cost: "low"
        service_level: "high"
    world_state:
      fleet:
        - {id: "VEH_01", type: "STANDARD_VAN", capacity_kg: 1000, status: "AVAILABLE"}
        - {id: "VEH_02", type: "STANDARD_VAN", capacity_kg: 800, status: "AVAILABLE"}
      customers:
        - {id: "CUST_VIP_01", name: "Hospital Emergency Pharmacy", priority: "vip"}
        - {id: "CUST_STD_02", name: "Retail Convenience Store", priority: "standard"}
      orders:
        - {id: "ORD_VIP_01", weight_kg: 300, is_locked: true, is_vip: true, tw_early: 60, tw_late: 120}
        - {id: "ORD_STD_02", weight_kg: 700, is_locked: false, is_vip: false, tw_early: 60, tw_late: 360}
    constraints:
      hard:
        - {id: "C1", name: "VehicleCapacity", type: "VEHICLE_CAPACITY", hardness: "HARD", relaxable: false}
        - {id: "C2", name: "TimeWindowLock_VIP", type: "TIME_WINDOW_LOCKED", hardness: "HARD_COMMITMENT", target_order: "ORD_VIP_01", locked_window: [60, 120], relaxable: false}
      soft:
        - {id: "C3", name: "MinimizeTotalDistance", weight: 1.0}
      preference:
        - {description: "Prioritize VIP arrival on time over vehicle consolidation"}
    decision_space:
      objective: "lexicographic_vip_fulfillment_then_cost"
      candidate_solutions_count: 2
      parallel_options:
        - {id: "opt_dedicated", description: "Dispatch dedicated van for VIP, separate van for standard"}
        - {id: "opt_consolidate", description: "Consolidate both onto single van, risk VIP arrival delay"}
    evaluation:
      expected_difficulty: "medium"
      expected_agent_separation: true
      separation_dimensions: ["semantic", "feasibility"]
      success_threshold:
        semantic_min: 0.9
        commitment_survival_min: 1.0

  - case_code: "D02"
    pattern_id: "PATTERN-D1-VIP-SLA-PROTECTION"
    variant_name: "Severe Capacity Deficit"
    decision_dilemma: "Total payload demand strictly exceeds available vehicle payload. Must fulfill VIP order and drop/defer standard orders."
    intent:
      primary_objective: "guarantee_vip_drop_noncritical_on_overflow"
      secondary_objectives: ["minimize_unfulfilled_standard_orders"]
      priority_rules:
        vip_customer: "high"
        cost: "medium"
        service_level: "high"
    world_state:
      fleet:
        - {id: "VEH_01", type: "STANDARD_VAN", capacity_kg: 600, status: "AVAILABLE"}
      customers:
        - {id: "CUST_VIP", name: "Central Dialysis Center", priority: "vip"}
        - {id: "CUST_STD_A", name: "General Clinic A", priority: "standard"}
        - {id: "CUST_STD_B", name: "General Clinic B", priority: "standard"}
      orders:
        - {id: "ORD_VIP", weight_kg: 350, is_locked: true, is_vip: true, tw_early: 0, tw_late: 180}
        - {id: "ORD_STD_A", weight_kg: 200, is_locked: false, is_vip: false, tw_early: 0, tw_late: 360}
        - {id: "ORD_STD_B", weight_kg: 200, is_locked: false, is_vip: false, tw_early: 0, tw_late: 360}
    constraints:
      hard:
        - {id: "C1", name: "VehicleCapacityLimit", type: "VEHICLE_CAPACITY", hardness: "HARD", relaxable: false}
        - {id: "C2", name: "MandatoryVIPLock", type: "TIME_WINDOW_LOCKED", hardness: "HARD_COMMITMENT", target_order: "ORD_VIP", locked_window: [0, 180], relaxable: false}
      soft:
        - {id: "C3", name: "StandardFulfillmentReward", weight: 1.0}
      preference:
        - {description: "Drop standard clinic orders if payload exceeds 600kg capacity"}
    decision_space:
      objective: "maximize_vip_then_standard_payload"
      candidate_solutions_count: 3
      parallel_options:
        - {id: "opt_vip_only", description: "Serve VIP + Clinic A (550kg), defer Clinic B"}
        - {id: "opt_violate_cap", description: "Attempt all 3 orders (750kg), violating vehicle capacity"}
    evaluation:
      expected_difficulty: "medium"
      expected_agent_separation: true
      separation_dimensions: ["feasibility", "semantic"]
      success_threshold:
        semantic_min: 0.9
        commitment_survival_min: 1.0

  # ==========================================
  # Pattern D2: Dynamic Replanning & Disruption
  # ==========================================
  - case_code: "D03"
    pattern_id: "PATTERN-D2-DYNAMIC-REPLANNING"
    variant_name: "Mid-Shift Mechanical Vehicle Breakdown"
    decision_dilemma: "Primary van carrying locked cold and ambient cargo breaks down. Must dynamically reroute surviving fleet."
    intent:
      primary_objective: "minimize_disruption_and_protect_locked_orders"
      secondary_objectives: ["minimize_additional_travel_time"]
      priority_rules:
        vip_customer: "high"
        cost: "medium"
        service_level: "high"
    world_state:
      fleet:
        - {id: "VEH_01", type: "COLD_REFRIGERATED", capacity_kg: 1000, status: "EN_ROUTE"}
        - {id: "VEH_02", type: "STANDARD_VAN", capacity_kg: 1000, status: "BROKEN_DOWN"}
        - {id: "VEH_03", type: "STANDARD_VAN", capacity_kg: 800, status: "EN_ROUTE"}
      customers:
        - {id: "CUST_01", name: "Pharmacy Chain", priority: "vip"}
      orders:
        - {id: "ORD_01", weight_kg: 200, req_cold: true, tw_early: 60, tw_late: 180, is_locked: false}
        - {id: "ORD_03", weight_kg: 250, req_cold: false, tw_early: 120, tw_late: 200, is_locked: true, is_vip: true}
        - {id: "ORD_04", weight_kg: 150, req_cold: true, tw_early: 180, tw_late: 360, is_locked: false}
        - {id: "ORD_06", weight_kg: 200, req_cold: false, tw_early: 240, tw_late: 480, is_locked: false}
    constraints:
      hard:
        - {id: "C1", name: "VehicleCapacity", type: "VEHICLE_CAPACITY", hardness: "HARD", relaxable: false}
        - {id: "C3", name: "ColdChainMatch", type: "COLD_CHAIN_MATCH", hardness: "HARD", relaxable: false}
        - {id: "C4", name: "TimeWindowLock_ORD03", type: "TIME_WINDOW_LOCKED", hardness: "HARD_COMMITMENT", target_order: "ORD_03", locked_window: [120, 200], relaxable: false}
      soft:
        - {id: "C5", name: "MinimizeRerouteCost", weight: 1.0}
      preference:
        - {description: "Preserve locked order ORD_03 on remaining active fleet"}
    decision_space:
      objective: "lexicographic_max_fulfilled_then_min_disruption"
      candidate_solutions_count: 2
      parallel_options:
        - {id: "opt_transfer", description: "Transfer ORD_03 to VEH_03 and keep cold chain on VEH_01"}
        - {id: "opt_cancel", description: "Cancel broken vehicle orders and return to base"}
    evaluation:
      expected_difficulty: "medium"
      expected_agent_separation: true
      separation_dimensions: ["runtime", "semantic"]
      success_threshold:
        semantic_min: 0.9
        commitment_survival_min: 1.0

  - case_code: "D04"
    pattern_id: "PATTERN-D2-DYNAMIC-REPLANNING"
    variant_name: "Urgent Intraday Injected Order"
    decision_dilemma: "High-priority emergency order appears mid-day. Must insert without invalidating prior locked commitments."
    intent:
      primary_objective: "insert_emergency_order_preserve_existing_locks"
      secondary_objectives: ["minimize_schedule_ripple"]
      priority_rules:
        vip_customer: "high"
        cost: "medium"
        service_level: "high"
    world_state:
      fleet:
        - {id: "VEH_01", type: "STANDARD_VAN", capacity_kg: 1000, status: "AVAILABLE"}
        - {id: "VEH_02", type: "STANDARD_VAN", capacity_kg: 1000, status: "AVAILABLE"}
      customers:
        - {id: "CUST_EMERGENCY", name: "ICU Medical Unit", priority: "vip"}
        - {id: "CUST_COMMITTED", name: "Routine Client", priority: "vip"}
      orders:
        - {id: "ORD_COMMITTED", weight_kg: 400, is_locked: true, is_vip: true, tw_early: 60, tw_late: 180}
        - {id: "ORD_EMERGENCY", weight_kg: 300, is_locked: true, is_vip: true, tw_early: 120, tw_late: 240}
        - {id: "ORD_OPTIONAL", weight_kg: 200, is_locked: false, is_vip: false, tw_early: 180, tw_late: 480}
    constraints:
      hard:
        - {id: "C1", name: "VehicleCapacity", type: "VEHICLE_CAPACITY", hardness: "HARD", relaxable: false}
        - {id: "C2", name: "CommittedOrderLock", type: "TIME_WINDOW_LOCKED", hardness: "HARD_COMMITMENT", target_order: "ORD_COMMITTED", locked_window: [60, 180], relaxable: false}
        - {id: "C3", name: "EmergencyOrderLock", type: "TIME_WINDOW_LOCKED", hardness: "HARD_COMMITMENT", target_order: "ORD_EMERGENCY", locked_window: [120, 240], relaxable: false}
      soft:
        - {id: "C4", name: "InsertionDelayPenalty", weight: 1.5}
      preference:
        - {description: "Insert emergency order onto separate vehicle or end of schedule to avoid perturbing committed client"}
    decision_space:
      objective: "lexicographic_protect_all_locks_then_distance"
      candidate_solutions_count: 2
      parallel_options:
        - {id: "opt_split_insert", description: "Route emergency order on VEH_02, maintain VEH_01 route intact"}
        - {id: "opt_force_insert", description: "Force into VEH_01, risking committed delivery delay"}
    evaluation:
      expected_difficulty: "medium"
      expected_agent_separation: true
      separation_dimensions: ["runtime", "semantic"]
      success_threshold:
        semantic_min: 0.9
        commitment_survival_min: 1.0

  # ==========================================
  # Pattern D3: Multi-Objective Cost-Service Tradeoff
  # ==========================================
  - case_code: "D05"
    pattern_id: "PATTERN-D3-COST-SERVICE-TRADEOFF"
    variant_name: "Overtime Vehicle Deployment vs Cost Penalty"
    decision_dilemma: "Tight time-windows require deploying extra overtime vehicle vs saving cost by delaying standard orders."
    intent:
      primary_objective: "balance_overtime_cost_and_ontime_rate"
      secondary_objectives: ["minimize_overtime_hours"]
      priority_rules:
        vip_customer: "high"
        cost: "high"
        service_level: "medium"
    world_state:
      fleet:
        - {id: "VEH_01", type: "STANDARD_VAN", capacity_kg: 1200, status: "AVAILABLE"}
      customers:
        - {id: "CUST_01", name: "Anchor Store", priority: "vip"}
        - {id: "CUST_02", name: "Peripheral Kiosk", priority: "flexible"}
      orders:
        - {id: "ORD_01", weight_kg: 400, is_locked: true, is_vip: true, tw_early: 0, tw_late: 180}
        - {id: "ORD_02", weight_kg: 600, is_locked: false, is_vip: false, tw_early: 180, tw_late: 360}
    constraints:
      hard:
        - {id: "C1", name: "VehicleCapacity", type: "VEHICLE_CAPACITY", hardness: "HARD", relaxable: false}
        - {id: "C2", name: "VIPLock", type: "TIME_WINDOW_LOCKED", hardness: "HARD_COMMITMENT", target_order: "ORD_01", locked_window: [0, 180], relaxable: false}
      soft:
        - {id: "C3", name: "OvertimePenalty", weight: 2.5}
      preference:
        - {description: "Serve VIP on time; defer peripheral kiosk if overtime exceeds budget"}
    decision_space:
      objective: "lexicographic_vip_then_min_overtime"
      candidate_solutions_count: 2
      parallel_options:
        - {id: "opt_overtime", description: "Serve both orders incurring overtime penalty"}
        - {id: "opt_defer", description: "Serve VIP only and defer flexible order to next day"}
    evaluation:
      expected_difficulty: "medium"
      expected_agent_separation: true
      separation_dimensions: ["feasibility", "semantic"]
      success_threshold:
        semantic_min: 0.9
        commitment_survival_min: 1.0

  - case_code: "D06"
    pattern_id: "PATTERN-D3-COST-SERVICE-TRADEOFF"
    variant_name: "Selective Order Deferral Under Route Congestion"
    decision_dilemma: "High traffic congestion inflates travel times. Agent must consciously defer lowest-tier flexible order to protect high-tier SLA."
    intent:
      primary_objective: "minimize_sla_penalties_via_selective_deferral"
      secondary_objectives: ["minimize_dropped_order_count"]
      priority_rules:
        vip_customer: "high"
        cost: "medium"
        service_level: "high"
    world_state:
      fleet:
        - {id: "VEH_01", type: "STANDARD_VAN", capacity_kg: 1000, status: "AVAILABLE"}
      customers:
        - {id: "CUST_PRIO_1", name: "Tier 1 Hospital", priority: "vip"}
        - {id: "CUST_PRIO_2", name: "Tier 2 Pharmacy", priority: "standard"}
        - {id: "CUST_PRIO_3", name: "Tier 3 Community Clinic", priority: "flexible"}
      orders:
        - {id: "ORD_T1", weight_kg: 300, is_locked: true, is_vip: true, tw_early: 0, tw_late: 120}
        - {id: "ORD_T2", weight_kg: 300, is_locked: false, is_vip: false, tw_early: 60, tw_late: 240}
        - {id: "ORD_T3", weight_kg: 300, is_locked: false, is_vip: false, tw_early: 60, tw_late: 300}
    constraints:
      hard:
        - {id: "C1", name: "VehicleCapacity", type: "VEHICLE_CAPACITY", hardness: "HARD", relaxable: false}
        - {id: "C2", name: "Tier1Lock", type: "TIME_WINDOW_LOCKED", hardness: "HARD_COMMITMENT", target_order: "ORD_T1", locked_window: [0, 120], relaxable: false}
      soft:
        - {id: "C3", name: "DelayPenaltyTier2", weight: 2.0}
        - {id: "C4", name: "DelayPenaltyTier3", weight: 0.5}
      preference:
        - {description: "If congestion threatens Tier 2, defer Tier 3 rather than risking Tier 2 delay"}
    decision_space:
      objective: "lexicographic_tier1_then_tier2_then_tier3"
      candidate_solutions_count: 2
      parallel_options:
        - {id: "opt_protect_t1_t2", description: "Deliver T1 and T2, defer T3"}
        - {id: "opt_attempt_all", description: "Attempt all 3, causing late delivery on T2"}
    evaluation:
      expected_difficulty: "medium"
      expected_agent_separation: true
      separation_dimensions: ["semantic", "feasibility"]
      success_threshold:
        semantic_min: 0.9
        commitment_survival_min: 1.0

  # ==========================================
  # Pattern D4: Capacity & Cold-Chain Allocation
  # ==========================================
  - case_code: "D07"
    pattern_id: "PATTERN-D4-CAPACITY-COLDCHAIN-ALLOCATION"
    variant_name: "Refrigerated Compartment Shortage"
    decision_dilemma: "High cold cargo demand with limited refrigerated van volume. Must preserve food safety compliance strictly."
    intent:
      primary_objective: "maximize_cold_chain_compliance_and_payload_rate"
      secondary_objectives: ["minimize_wasted_refrigerated_capacity"]
      priority_rules:
        vip_customer: "medium"
        cost: "medium"
        service_level: "high"
    world_state:
      fleet:
        - {id: "VEH_COLD_01", type: "COLD_REFRIGERATED", capacity_kg: 1000, status: "AVAILABLE"}
        - {id: "VEH_STD_02", type: "STANDARD_VAN", capacity_kg: 1000, status: "AVAILABLE"}
      customers:
        - {id: "CUST_FRESH", name: "Supermarket Fresh Section", priority: "vip"}
        - {id: "CUST_DRY", name: "General Goods Warehouse", priority: "standard"}
      orders:
        - {id: "ORD_ICE", weight_kg: 400, req_cold: true, is_locked: true, tw_early: 0, tw_late: 240}
        - {id: "ORD_DRY_01", weight_kg: 500, req_cold: false, is_locked: false, tw_early: 0, tw_late: 360}
        - {id: "ORD_DRY_02", weight_kg: 400, req_cold: false, is_locked: false, tw_early: 60, tw_late: 360}
    constraints:
      hard:
        - {id: "C1", name: "VehicleCapacity", type: "VEHICLE_CAPACITY", hardness: "HARD", relaxable: false}
        - {id: "C2", name: "ColdChainEnforcement", type: "COLD_CHAIN_MATCH", hardness: "HARD", relaxable: false}
        - {id: "C3", name: "VIPColdLock", type: "TIME_WINDOW_LOCKED", hardness: "HARD_COMMITMENT", target_order: "ORD_ICE", locked_window: [0, 240], relaxable: false}
      soft:
        - {id: "C4", name: "PayloadEfficiency", weight: 1.0}
      preference:
        - {description: "Pack dry goods onto standard van first before utilizing surplus cold capacity"}
    decision_space:
      objective: "lexicographic_cold_safety_then_payload_rate"
      candidate_solutions_count: 2
      parallel_options:
        - {id: "opt_split", description: "Dedicate cold van to cold items, standard van to dry goods"}
        - {id: "opt_mix", description: "Mix dry goods into cold van to balance vehicle utilization"}
    evaluation:
      expected_difficulty: "medium"
      expected_agent_separation: true
      separation_dimensions: ["feasibility", "semantic"]
      success_threshold:
        semantic_min: 0.9
        commitment_survival_min: 1.0

  - case_code: "D08"
    pattern_id: "PATTERN-D4-CAPACITY-COLDCHAIN-ALLOCATION"
    variant_name: "Cross-Contamination & Vehicle Isolation"
    decision_dilemma: "Chemical / hazardous supplies must not cross-load with fresh food items on the same multi-drop vehicle."
    intent:
      primary_objective: "strictly_isolate_incompatible_cargo_types"
      secondary_objectives: ["minimize_fleet_count"]
      priority_rules:
        vip_customer: "high"
        cost: "low"
        service_level: "high"
    world_state:
      fleet:
        - {id: "VEH_01", type: "COLD_REFRIGERATED", capacity_kg: 1000, status: "AVAILABLE"}
        - {id: "VEH_02", type: "STANDARD_VAN", capacity_kg: 1000, status: "AVAILABLE"}
      customers:
        - {id: "CUST_GROCERY", name: "Organic Grocery", priority: "vip"}
        - {id: "CUST_IND", name: "Industrial Lab", priority: "vip"}
      orders:
        - {id: "ORD_FOOD", weight_kg: 300, req_cold: true, is_locked: true, tw_early: 0, tw_late: 180}
        - {id: "ORD_CHEMICAL", weight_kg: 300, req_cold: false, is_locked: true, tw_early: 0, tw_late: 180}
    constraints:
      hard:
        - {id: "C1", name: "VehicleCapacity", type: "VEHICLE_CAPACITY", hardness: "HARD", relaxable: false}
        - {id: "C2", name: "FoodColdMatch", type: "COLD_CHAIN_MATCH", hardness: "HARD", relaxable: false}
        - {id: "C3", name: "FoodLock", type: "TIME_WINDOW_LOCKED", hardness: "HARD_COMMITMENT", target_order: "ORD_FOOD", locked_window: [0, 180], relaxable: false}
        - {id: "C4", name: "ChemicalLock", type: "TIME_WINDOW_LOCKED", hardness: "HARD_COMMITMENT", target_order: "ORD_CHEMICAL", locked_window: [0, 180], relaxable: false}
      soft:
        - {id: "C5", name: "DistanceCost", weight: 1.0}
      preference:
        - {description: "Never co-locate chemical and fresh food on same vehicle route"}
    decision_space:
      objective: "lexicographic_safety_isolation_then_cost"
      candidate_solutions_count: 2
      parallel_options:
        - {id: "opt_isolate", description: "Route Food on VEH_01, Chemical on VEH_02"}
        - {id: "opt_co_route", description: "Co-route both on VEH_01 to save vehicle cost (Safety violation)"}
    evaluation:
      expected_difficulty: "medium"
      expected_agent_separation: true
      separation_dimensions: ["feasibility", "semantic"]
      success_threshold:
        semantic_min: 0.9
        commitment_survival_min: 1.0

  # ==========================================
  # Pattern D5: Memory-Guided Adaptation
  # ==========================================
  - case_code: "D09"
    pattern_id: "PATTERN-D5-MEMORY-GUIDED-ADAPTATION"
    variant_name: "Valid Episodic Congestion Memory Exploitation"
    decision_dilemma: "Historical memory shows recurring morning dock bottleneck at commercial hub. Exploiting memory avoids severe delivery failure."
    intent:
      primary_objective: "exploit_past_operational_memory_for_robust_routing"
      secondary_objectives: ["avoid_known_recurring_bottlenecks"]
      priority_rules:
        vip_customer: "high"
        cost: "medium"
        service_level: "high"
    world_state:
      fleet:
        - {id: "VEH_01", type: "STANDARD_VAN", capacity_kg: 1000, status: "AVAILABLE"}
        - {id: "VEH_02", type: "STANDARD_VAN", capacity_kg: 1000, status: "AVAILABLE"}
      customers:
        - {id: "CUST_DOWNTOWN", name: "Downtown Mall Hub", priority: "vip"}
        - {id: "CUST_SUBURB", name: "Suburban Medical Clinic", priority: "standard"}
      orders:
        - {id: "ORD_DOWNTOWN", weight_kg: 300, is_locked: true, is_vip: true, tw_early: 60, tw_late: 180}
        - {id: "ORD_SUBURB", weight_kg: 300, is_locked: false, is_vip: false, tw_early: 60, tw_late: 360}
    constraints:
      hard:
        - {id: "C1", name: "VehicleCapacity", type: "VEHICLE_CAPACITY", hardness: "HARD", relaxable: false}
        - {id: "C2", name: "DowntownVIPLock", type: "TIME_WINDOW_LOCKED", hardness: "HARD_COMMITMENT", target_order: "ORD_DOWNTOWN", locked_window: [60, 180], relaxable: false}
      soft:
        - {id: "C3", name: "BottleneckAvoidancePenalty", weight: 2.0}
      preference:
        - {description: "Apply episodic memory recommendation to route downtown deliveries before rush hour"}
    decision_space:
      objective: "lexicographic_memory_robustness_then_distance"
      candidate_solutions_count: 2
      parallel_options:
        - {id: "opt_memory_guided", description: "Route early morning slot per historical episodic memory"}
        - {id: "opt_naive_shortest", description: "Route purely on Euclidean distance, risking rush hour trap"}
    evaluation:
      expected_difficulty: "medium"
      expected_agent_separation: true
      separation_dimensions: ["memory", "runtime"]
      success_threshold:
        semantic_min: 0.9
        commitment_survival_min: 1.0

  - case_code: "D10"
    pattern_id: "PATTERN-D5-MEMORY-GUIDED-ADAPTATION"
    variant_name: "Stale Memory Invalidation & Fallback"
    decision_dilemma: "Historical memory suggests avoiding a bridge that has just reopened. Must detect memory context invalidation rather than hallucinating outdated avoidance."
    intent:
      primary_objective: "detect_memory_invalidation_and_route_optimally"
      secondary_objectives: ["avoid_spurious_detours"]
      priority_rules:
        vip_customer: "high"
        cost: "high"
        service_level: "high"
    world_state:
      fleet:
        - {id: "VEH_01", type: "STANDARD_VAN", capacity_kg: 1000, status: "AVAILABLE"}
      customers:
        - {id: "CUST_RIVERSIDE", name: "Riverside Center", priority: "vip"}
      orders:
        - {id: "ORD_RIVERSIDE", weight_kg: 300, is_locked: true, is_vip: true, tw_early: 0, tw_late: 180}
    constraints:
      hard:
        - {id: "C1", name: "VehicleCapacity", type: "VEHICLE_CAPACITY", hardness: "HARD", relaxable: false}
        - {id: "C2", name: "RiversideLock", type: "TIME_WINDOW_LOCKED", hardness: "HARD_COMMITMENT", target_order: "ORD_RIVERSIDE", locked_window: [0, 180], relaxable: false}
      soft:
        - {id: "C3", name: "DetourDistancePenalty", weight: 1.0}
      preference:
        - {description: "Do not take historical 30km detour if bridge repair is confirmed complete"}
    decision_space:
      objective: "lexicographic_validate_memory_then_cost"
