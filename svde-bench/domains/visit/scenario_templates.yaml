      primary_objective: "exploit_valid_relationship_memory_and_reject_mismatched_context"
      secondary_objectives: ["avoid_gatekeeper_friction"]
      priority_rules:
        vip_customer: "high"
        cost: "medium"
        service_level: "high"
    world_state:
      fleet:
        - {id: "REP_01", type: "STANDARD_VAN", capacity_kg: 480, status: "AVAILABLE"}
      customers:
        - {id: "CUST_MANAGER_RELATIONSHIP", name: "Heritage Department Store", priority: "vip"}
        - {id: "CUST_GENERAL_RETAIL", name: "General Retailer", priority: "standard"}
      orders:
        - {id: "VISIT_HERITAGE", weight_kg: 100, is_locked: true, is_vip: true, tw_early: 0, tw_late: 180}
        - {id: "VISIT_GENERAL", weight_kg: 100, is_locked: false, is_vip: false, tw_early: 60, tw_late: 360}
    constraints:
      hard:
        - {id: "C1", name: "WorkloadCap", type: "VEHICLE_CAPACITY", hardness: "HARD", relaxable: false}
        - {id: "C2", name: "HeritageTimeLock", type: "TIME_WINDOW_LOCKED", hardness: "HARD_COMMITMENT", target_order: "VISIT_HERITAGE", locked_window: [0, 180], relaxable: false}
      soft:
        - {id: "C3", name: "GatekeeperFrictionPenalty", weight: 2.0}
