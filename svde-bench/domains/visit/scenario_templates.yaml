  - case_code: "V10"
    pattern_id: "PATTERN-V5-RELATIONSHIP-MEMORY-TRANSFER"
    variant_name: "Negative Memory Transfer Defense (Store Management Change)"
    decision_dilemma: "Historical memory says Friday manager is absent; new management has taken over and operates on Fridays. Agent must reject stale memory and exploit Friday slot."
    intent:
      primary_objective: "detect_management_change_and_reject_stale_memory"
      secondary_objectives: ["avoid_spurious_weekday_congestion"]
      priority_rules:
        vip_customer: "high"
        cost: "high"
        service_level: "high"
    world_state:
      fleet:
        - {id: "REP_01", type: "STANDARD_VAN", capacity_kg: 480, status: "AVAILABLE"}
      customers:
        - {id: "CUST_FRIDAY_STORE", name: "New Management Clinic", priority: "vip"}
      orders:
        - {id: "VISIT_FRIDAY_SLOT", weight_kg: 100, is_locked: true, is_vip: true, tw_early: 0, tw_late: 180}
    constraints:
      hard:
        - {id: "C1", name: "DailyHoursCap", type: "VEHICLE_CAPACITY", hardness: "HARD", relaxable: false}
        - {id: "C2", name: "FridayVisitLock", type: "TIME_WINDOW_LOCKED", hardness: "HARD_COMMITMENT", target_order: "VISIT_FRIDAY_SLOT", locked_window: [0, 180], relaxable: false}
      soft:
        - {id: "C3", name: "DetourPenalty", weight: 1.0}
      preference:
        - {description: "Reject stale memory claiming Friday is blocked; schedule directly on Friday"}
    decision_space:
      objective: "lexicographic_reject_stale_memory_then_route"
      candidate_solutions_count: 2
      parallel_options:
        - {id: "opt_direct_friday", description: "Schedule Friday directly based on updated world state"}
