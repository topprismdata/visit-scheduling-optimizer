build_vs_reuse_gate:
  six_questions:
    - "是否存在成熟开源/工业级方案?"
    - "成熟方案能否通过 Adapter 适配?"
    - "该组件是否构成 TopPrism 核心业务差异化壁垒?"
    - "自研成本是否显著低于'适配+定制'?"
    - "是否承诺对齐成熟组件的完整测试与文档?"
    - "无法保障维护 → 强制 REUSE"
  default_verdict: "底层算力 100% REUSE / ADAPT，绝对禁止自研造轮子"
  top_prism_own_list:
    - 销售拜访决策本体与需求引擎 (VisitDemand 生成)
    - DecisionModelCompiler (显式可追溯、多后端编译)
    - 拜访场景专属 Pricing (CONDITIONAL BUILD——仅当选定分解策略且现成工具不满足)
    - ReLoop 行为测试套件
    - PROV-O aligned 可审计决策因果图
