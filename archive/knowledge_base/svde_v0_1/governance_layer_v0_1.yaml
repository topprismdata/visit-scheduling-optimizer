      mandate: "数学约束非文本——Typed Constraint（type/cardinality/level/relaxable/provenance）；Compiler 期类型检查（AddExactlyOne+k=2 → Type Error）"
      naming: "正式名: Decision Constraint Type System（SVDE 核心组件）"
    component_2_dsvl:
      naming: "正式名: Decision Semantic Validation Layer (DSVL)——替代 Validation Layer（避免与普通数据校验混淆）"
      three_duties: [Invariant Checking, Constraint Semantic Checking, Trace Consistency Checking(Decision→Model→Solution→Outcome)]
      position: "前置+后置（类比编译器 parse-time check × runtime check）——非仅末尾"
      distinction: "Solver 验证 solution feasibility('解满足数学约束吗')；DSVL 验证 decision feasibility('模型仍代表原业务决策吗')"
    gt_ladder: "GT-Micro ✅ → GT-Small(3.3) → GT-Medium → GT-Real——不跳档；规模增长必伴语义稳定验证（最大风险=semantic drift 非求解性能）"
    oracle_evolution: "Enumeration Oracle(Micro) → Exact Solver Oracle(Small·3.3) → Independent Solver Oracle → Production Reality Oracle"
