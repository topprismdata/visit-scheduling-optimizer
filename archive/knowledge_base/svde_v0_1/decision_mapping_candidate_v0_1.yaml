## 角色：Knowledge Builder（承接 Step 1 的 17 条 Business Evidence，先搭"业务→决策"桥，再进数学）

version: SVDE-KB-DecisionMapping-v0.1
generated_at: "2026-08-22"
input: business_knowledge_library_v0_1.yaml（BE-001..BE-017 + CC-01..03 + G-1..G-5）

mapping_convention:
  purpose: "数学之前先确认：每条业务知识到底支持什么决策——防止 Step 2 退化为'论文→算法模式'老路"
  chain: "Business Concept → Decision Candidate → Mathematical Pattern（Step 2 从本表反推，不从论文正推）"
  status_rule: "本层所有映射一律 Candidate（评审指令）；已有场景背书的映射加注 mapping_validated 证据，但状态不升格——升格通道仅 Gate 复审"
  dm_ref_rule: "映射目标仅限 DM-001..008；DM-009/DM-010 仅作为合并裁定先例被引用（历史引用合法，非映射目标）"
