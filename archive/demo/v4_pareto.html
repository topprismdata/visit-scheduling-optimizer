<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MO-ALNS v4 三目标帕累托前沿 · 09线 (基准=v3)</title>
<style>
:root{--bg:#fafaf7;--surface:#fff;--fg:#1a1916;--muted:#6b6964;--border:#e8e5df;--accent:#0f6f5c;--fd:Georgia,serif;--fb:-apple-system,system-ui,sans-serif;--fm:ui-monospace,Menlo,monospace}
*,*::before,*::after{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:13px;line-height:1.5}
h3{margin:0;font-size:12px}p{margin:0}
.eyebrow{font-family:var(--fm);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.container{max-width:1200px;margin-inline:auto;padding-inline:20px}
.topnav{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.tin{display:flex;align-items:center;justify-content:space-between;padding-block:8px;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--fd);font-size:16px;font-weight:600}
.back{text-decoration:none;padding:5px 10px;background:#f1f5f9;color:var(--fg);border:1px solid var(--border);border-radius:6px;font-size:11px;font-weight:600}
.sec{padding-block:16px}.sec+.sec{border-top:1px solid var(--border)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:800px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .2s,transform .15s}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.kpi-card.selected{border-color:var(--accent);border-width:2px;background:#f0fdf4}
.kpi-icon{font-size:20px}.kpi-label{font-size:12px;font-weight:700;margin-top:2px}
.kpi-val{font-family:var(--fd);font-size:26px;line-height:1;color:var(--accent);font-weight:600;margin-top:6px}
.kpi-val.red{color:#dc2626}.kpi-val.green{color:#16a34a}.kpi-val.purple{color:#8b5cf6}.kpi-val.gray{color:#64748b}
.kpi-sub{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}
.pareto-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.pareto-grid{grid-template-columns:1fr}}
.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.chart-title{font-weight:700;font-size:13px;margin-bottom:8px}
.tbl-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;overflow-x:auto}
.tbl-box table{width:100%;border-collapse:collapse;font-size:11px}
.tbl-box th{padding:8px 6px;background:#f1f5f9;color:var(--muted);text-align:left;font-weight:600;white-space:nowrap}
.tbl-box td{padding:7px 6px;border-bottom:1px solid var(--border);font-family:var(--fm);white-space:nowrap}
.tbl-box tr.hl td{background:#f0fdf4;font-weight:700}
.insight{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:14px 18px;margin-top:10px;font-size:12px;line-height:1.6}
.insight strong{color:var(--accent)}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px 16px;font-size:12px;line-height:1.6;color:#92400e}
.pf{padding-block:14px;color:var(--muted);font-size:10px;border-top:1px solid var(--border)}
.chip{display:inline-block;font-family:var(--fm);font-size:10px;padding:2px 8px;border-radius:10px;background:#f1f5f9;color:#334155;margin:2px 3px 0 0}
</style></head><body>
<header class="topnav"><div class="container tin">
<span class="logo">MO-ALNS v4 · 三目标帕累托前沿 · 09线 梁健满</span>
<a class="back" href="index.html">⬅ 返回全办对比</a>
</div></header>
<main class="container">

<section class="sec" style="padding-block:12px 0">
<div class="note" id="baseNote"></div>
<div class="insight" id="keyFinding" style="margin-top:10px"></div>
</section>

<section class="sec" style="padding-block:0">
<p class="eyebrow">四个命名方案 · 点击卡片查看改动明细</p>
<div class="kpi-grid" id="presetCards"></div>
<div class="insight" id="insightBox"></div>
</section>

<section class="sec">
<div class="pareto-grid">
<div class="chart-box"><div class="chart-title">🎯 里程 (f1) vs 相对v3再改动 (f2) · 帕累托前沿</div><div id="chartA"></div></div>
<div class="chart-box"><div class="chart-title">⚖️ 再改动 (f2) vs 工作量均衡度 CV (f3) · 花钱买均衡曲线</div><div id="chartB"></div></div>
</div>
</section>

<section class="sec"><div class="container">
<p class="eyebrow">完整非支配解集</p>
<div class="tbl-box" style="max-height:360px;overflow-y:auto">
<table id="frontTable">
<thead><tr><th>#</th><th>里程 (km)</th><th>相对v3再改动 (店)</th><th>再改动占比</th><th>CV 均衡度</th><th>freq</th></tr></thead>
<tbody></tbody>
</table>
</div>
</div></section>
</main>
<footer class="pf"><div class="container" id="foot"></div></footer>
<script>
let DATA=null,sel='recommended';
const V3=263.2, CP=326.6, CROSS_VAL=63.4;
const PRESET_META={
  conservative:{icon:'🔒',label:'保守型 = v3 基准',color:'gray',desc:'零再改动，里程最优。v3 已是"不改日期"之外的全局最优。'},
  aggressive:{icon:'🔥',label:'激进型 里程最低',color:'green',desc:'帕累托里程下界，恰与 v3 重合——再省已无空间。'},
  recommended:{icon:'⭐',label:'推荐型 膝点',color:'',desc:'四维理想点最近，里程↔均衡↔改动的平衡取舍。'},
  balanced:{icon:'⚖️',label:'均衡型 CV最低',color:'purple',desc:'每日工作量最均匀，但里程上升明显，用里程换公平。'}
};

async function init(){
  DATA=await (await fetch('v4_pareto_09.json')).json();
  document.getElementById('baseNote').innerHTML=`<strong>基线口径：</strong>本帕累托前沿以 <strong>v3 月度优化结果（计划数据）</strong>为基准，`+
    `横轴"再改动"= 在 v3 已排好的店→日分配上<strong>还要挪动几家店</strong>。f2=0 即 v3 本身。`+
    `目标为三维：里程 f1 / 再改动 f2 / 工作量变异系数 CV f3（跨区率 f4 已废弃）。`;
  document.getElementById('keyFinding').innerHTML=`<strong>关键发现 — "改日期"值多少公里？</strong> `+
    `CP-SAT 精确求解（锁死原日期、只排顺序）= <strong>${CP} km</strong>；v3（允许改日期）= <strong>${V3} km</strong>。`+
    `差值 <strong>${CROSS_VAL} km（−19.4%）</strong>就是"改日期"本身的价值——顺序层面无论多精确都追不回来。`+
    `因此 CP-SAT 被 v3 双维度支配、退出前沿，<strong>前沿的 0 改动端点就是 v3</strong>。`;
  renderCards();renderCharts();renderTable();selectPreset('conservative');
}

function fmt(n){return n.toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1})}

function renderCards(){
  const box=document.getElementById('presetCards');box.innerHTML='';
  const order=['conservative','aggressive','recommended','balanced'];
  order.forEach(k=>{
    const v=DATA.presets[k],m=PRESET_META[k];
    const card=document.createElement('div');card.className='kpi-card';card.id='card_'+k;
    card.onclick=()=>selectPreset(k);
    card.innerHTML=`<div class="kpi-icon">${m.icon}</div><div class="kpi-label">${m.label}</div>`+
      `<div class="kpi-val ${m.color}">${fmt(v.km)}<span style="font-size:12px"> km</span></div>`+
      `<div class="kpi-sub">在 v3 上再挪 ${v.changed} 店 · CV=${v.cv.toFixed(3)}<br/>频次守恒 ${v.freq_ok?'✅':'⚠️'}</div>`;
    box.appendChild(card);
  });
}

function selectPreset(k){
  sel=k;
  document.querySelectorAll('.kpi-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('card_'+k)?.classList.add('selected');
  const v=DATA.presets[k];
  document.getElementById('insightBox').innerHTML=`<strong>${PRESET_META[k].icon} ${PRESET_META[k].label}</strong>：`+
    `${PRESET_META[k].desc}<br/><span class="chip">里程 ${fmt(v.km)} km</span>`+
    `<span class="chip">相对v3再改动 ${v.changed} 店 (${(v.changed/DATA.total_stores*100).toFixed(1)}%)</span>`+
    `<span class="chip">每日均衡度 CV ${v.cv.toFixed(4)}</span>`;
}

function scatter(elId,pts,xk,yk,xlab,ylab,opts){
  const W=560,H=300,pL=54,pR=20,pT=16,pB=40;
  const xs=pts.map(p=>p[xk]),ys=pts.map(p=>p[yk]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sx=v=>pL+(v-x0)/(x1-x0+1e-9)*(W-pL-pR);
  const sy=v=>H-pB-(v-y0)/(y1-y0+1e-9)*(H-pT-pB);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%">`;
  s+=`<line x1="${pL}" y1="${H-pB}" x2="${W-pR}" y2="${H-pB}" stroke="#e2e8f0"/>`;
  s+=`<line x1="${pL}" y1="${pT}" x2="${pL}" y2="${H-pB}" stroke="#e2e8f0"/>`;
  for(let i=0;i<=4;i++){
    const xv=x0+(x1-x0)*i/4,px=sx(xv);
    s+=`<line x1="${px}" y1="${pT}" x2="${px}" y2="${H-pB}" stroke="#f1f5f9"/>`;
    s+=`<text x="${px}" y="${H-pB+16}" font-size="10" fill="#94a3b8" text-anchor="middle">${xlab==='km'?xv.toFixed(0):xv.toFixed(0)}</text>`;
  }
  (opts&&opts.vlines||[]).forEach(([v,c,t])=>{
    const px=sx(v);s+=`<line x1="${px}" y1="${pT}" x2="${px}" y2="${H-pB}" stroke="${c}" stroke-dasharray="4 3" stroke-width="1.5"/>`;
    s+=`<text x="${px}" y="${pT+12}" font-size="9" fill="${c}" font-weight="700" text-anchor="middle">${t}</text>`;
  });
  pts.forEach((p,i)=>{
    const x=sx(p[xk]),y=sy(p[yk]);
    s+=`<circle cx="${x}" cy="${y}" r="4" fill="#94a3b8" opacity="0.5"/>`;
    s+=`<title>#${p.id} ${p[xk].toFixed(1)} / ${p[yk].toFixed(3)}</title>`;
    if(i===0||i===pts.length-1)s+=`<text x="${x+7}" y="${y+3}" font-size="9" fill="#334155">${p[xk].toFixed(1)} · ${p[yk].toFixed(2)}</text>`;
  });
  s+=`<text x="${W/2}" y="${H-6}" font-size="10" fill="#6b6964" text-anchor="middle">${opts&&opts.xTitle||xlab}</text>`;
  s+=`<text x="14" y="${H/2}" font-size="10" fill="#6b6964" text-anchor="middle" transform="rotate(-90 14 ${H/2})">${opts&&opts.yTitle||ylab}</text>`;
  return s+'</svg>';
}

function renderCharts(){
  const front=[...DATA.pareto_front].sort((a,b)=>a.changed-b.changed||a.km-b.km);
  document.getElementById('chartA').innerHTML=scatter('chartA',front,'km','changed','km','改动',
    {xTitle:'里程 f1 (km) →',yTitle:'← 相对v3再改动 f2 (店)',vlines:[]});
  document.getElementById('chartB').innerHTML=scatter('chartB',front,'changed','cv','改动','CV',
    {xTitle:'相对v3再改动 f2 (店) →',yTitle:'工作量变异系数 f3 → (越低越均衡)',vlines:[]});
  // overlay preset markers
  Object.entries(DATA.presets).forEach(([k,v])=>{
    // charts are static strings; preset positions noted in insight box
  });
}

function renderTable(){
  const tb=document.querySelector('#frontTable tbody');tb.innerHTML='';
  DATA.pareto_front.forEach(p=>{
    const tr=document.createElement('tr');
    const isPreset=Object.values(DATA.presets).some(v=>Math.abs(v.km-p.km)<0.6&&v.changed===p.changed);
    if(isPreset)tr.className='hl';
    tr.innerHTML=`<td>${p.id}</td><td style="color:var(--accent)">${fmt(p.km)}</td>`+
      `<td>${p.changed}</td><td>${(p.changed/DATA.total_stores*100).toFixed(1)}%</td>`+
      `<td>${p.cv.toFixed(4)}</td><td>${p.freq? '':'✅'}</td>`;
    tb.appendChild(tr);
  });
  document.getElementById('foot').innerHTML=
    `09线 · 梁健满 · 163店/686次/23工作日 · NSGA-II ${DATA.generations}代 · 前沿${DATA.front_size}个非支配解 · `+
    `基准=v3(计划数据) · 频次守恒100% · <a href="index.html" style="color:var(--accent)">返回</a>`;
}
init();
</script></body></html>
