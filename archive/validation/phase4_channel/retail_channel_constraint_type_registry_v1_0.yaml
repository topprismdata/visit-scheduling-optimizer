type_check_rules:
  - id: CH-TC-001
    name: FiscalBudgetHardnessCheck
    rule: "CC01 (Capex) 与 CC02 (Opex) 的 hardness 恒为 HARD，relaxable 恒为 false；严禁通过罚项软化财政红线"
  - id: CH-TC-002
    name: TierEligibilityIntegrity
    rule: "旗舰店（FMT_FLAGSHIP）变量仅允许在 T1 商圈创建，非 T1 商圈变量创建立即阻断"
  - id: CH-TC-003
    name: StrategicCoverageNotZero
    rule: "T1 核心商圈的 C07 约束右端项必须 >= 1，严禁生成允许零覆盖的空约束"
  - id: CH-TC-004
    name: SpatialExclusionPairGeneration
    rule: "空间排他点对生成器必须基于商圈距离矩阵生成全部距离 < 4 的同业态互斥对"
