# 动态生成期检查规则（Dynamic Type Check Rules DD-TC-001..004）
# ═══════════════════════════════════════════════════════════════
type_check_rules:
  - id: DD-TC-001
    name: HardLockNeverRelaxed
    rule: "DC04 (TimeWindowLock) 的 hardness 恒为 HARD，relaxable 恒为 false；任何重排优化企图移动锁定承诺立即报 TYPE_ERROR"
  - id: DD-TC-002
    name: ColdChainVehMatch
    rule: "DC03 要求冷链订单必须绑定具备 is_cold_chain==true 的车辆，普货车辆绑定冷链订单直接阻断"
  - id: DD-TC-003
    name: PastEventVariableExclusion
    rule: "DC06 确保状态为 AT_STOP / DELIVERED 的订单不得作为布尔决策变量重复创建，必须作为确定性时空前缀常数输入"
  - id: DD-TC-004
    name: ShiftHoursCeilingCheck
    rule: "DC05 司机驾驶工时上限 600min 为刚性硬约束，严禁作为软目标惩罚项编译"
