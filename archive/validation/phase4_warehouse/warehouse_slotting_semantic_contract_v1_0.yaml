# ═══════════════════════════════════════════════════════════════
# §2 业务约束清单（Semantic Constraints C1–C8）
# ═══════════════════════════════════════════════════════════════
constraints:
  - {id: C1, name: SKUAssignmentExact,   type: ASSIGNMENT_EXACT,   hardness: HARD,  relaxable: false, text: "每个必存 SKU 必须且仅能分配到一个库位（一次性完整存放）"}
  - {id: C2, name: LocationCapacity,     type: LOCATION_CAPACITY,  hardness: HARD,  relaxable: false, text: "分配到库位的 SKU 体积 ≤ cap_volume 且 重量 ≤ cap_weight"}
  - {id: C3, name: LocationOccupancy,    type: LOCATION_OCCUPANCY, hardness: HARD,  relaxable: false, text: "每个库位最多容纳 1 个 SKU（独占货位策略）"}
  - {id: C4, name: TempCompatibility,    type: TEMP_COMPATIBILITY, hardness: HARD,  relaxable: false, text: "SKU 温度需求与库位温度严格一致（冷藏 SKU 严禁入常温区）"}
  - {id: C5, name: HazmatIsolation,      type: HAZMAT_ISOLATION,   hardness: HARD,  relaxable: false, text: "危化品 SKU（SKU_D1）严禁与食品类（BEVERAGE/SNACK/FRESH/DAIRY/GRAIN）相邻（曼哈顿距离 < 15 视为相邻违规）"}
  - {id: C6, name: HeavyBottomFloor,     type: HEAVY_FLOOR_RULE,   hardness: HARD,  relaxable: false, text: "重型 SKU（is_heavy==true）必须存放在承重 ≥ 700kg 的强化库位（L04-L08）"}
  - {id: C7, name: FastVelocityAffinity, type: VELOCITY_AFFINITY,  hardness: SOFT_PREFERENCE, relaxable: true, text: "高周转 SKU（pick_freq ≥ 80）优先分配至 FastZone（靠近 I/O 门）"}
  - {id: C8, name: OptionalSlotting,     type: OPTIONAL_SLOTTING,  hardness: SOFT_PREFERENCE, relaxable: true, text: "促销 SKU（is_optional==true）在库位充裕时择优存放，不足时可 defer"}

# ═══════════════════════════════════════════════════════════════
# §3 决策级不变量（Decision Invariants I1–I4 —— DSVL 核心守卫）
# ═══════════════════════════════════════════════════════════════
invariants:
  - {id: I1, name: HazmatSafetyInvariant, statement: "食品安全与危化品绝对物理隔离，任何优化目标不得牺牲此项（Hard 0 违规）"}
  - {id: I2, name: ColdChainIntegrityInvariant, statement: "冷链品类（FRESH/DAIRY）100% 锁定 ColdZone（L09-L12），温区不可穿越"}
  - {id: I3, name: PhysicalCapacitySafetyInvariant, statement: "体积与承重为刚性物理上限，零容忍过载"}
  - {id: I4, name: HeavySafetyInvariant, statement: "重型货品禁止上高位或轻质货架，承重不变量绝对保持"}

# ═══════════════════════════════════════════════════════════════
# §4 规范目标函数（Canonical Objective: Lexicographic 3-Tier）
# ═══════════════════════════════════════════════════════════════
objective_canonical:
  L1: "∀ HARD 约束满足（C1–C6 全部为 0 违反）"
  L2: "max Σ 必存 SKU 存放数 + 促销 SKU 存放数（满分 = 7 + 1 = 8 SKU）"
  L3: "min 搬运拣选总功耗 = Σ (velocity_pick_freq × dist_to_io)"
  comparison: lexicographic
  output: "(L1_status, L2_count, L3_pick_cost)"

# ═══════════════════════════════════════════════════════════════
# §5 变异分类法（Data Variation vs. Semantic Variation）
# ═══════════════════════════════════════════════════════════════
variation_boundary:
  data_variation: "拣选动线距离微调、SKU 货重在承重上限内波动、周转率微调（仅影响 L3 功耗数值，不改变 L1/L2 结构）"
  semantic_variation: "冷链温区故障（Cold 库位归零）、新增危化品强制排他、库位承重下调导致 Heavy SKU 无法入库（迫使触发异常链）"
