# Golden Case 003 — Cold Chain Vehicle Anomaly Recovery v0.1
metadata:
  id: "CASE-003-COLDCHAIN-RECOVERY"
  domain: "Dynamic Fleet Route Logistics"
  name: "Cold Chain Vehicle Anomaly Recovery v0.1"
  tags: ["cold_chain", "runtime_adaptation", "delivery"]

intent:
  objective: "Preserve cold-chain integrity under vehicle anomaly"

world_state:
  depot: [0, 0]
  fleet:
    - {id: "VEH_COLD_01", type: "COLD_REFRIGERATED", capacity_kg: 800, status: "ALARMED"}
    - {id: "VEH_AMB_01",  type: "STANDARD_VAN",      capacity_kg: 800, status: "AVAILABLE"}
  orders:
    - {id: "ORD_COLD_A", weight_kg: 200, req_cold: true,  tw_early: 60, tw_late: 180, is_locked: true, is_vip: true}
    - {id: "ORD_COLD_B", weight_kg: 150, req_cold: true,  tw_early: 60, tw_late: 240, is_locked: false}
    - {id: "ORD_AMB_A",  weight_kg: 200, req_cold: false, tw_early: 60, tw_late: 240, is_locked: false}

semantic_contract:
  constraints:
    - id: "C_COLD"
      name: "ColdChainMatch"
      type: "COLD_CHAIN_MATCH"
      hardness: "HARD"
      relaxable: false

runtime_context:
  timestamp_min: 120
  past_delivered_orders: []

events:
  - event_id: "EVT_COLD_ALARM"
    event_type: "TEMPERATURE_ALARM"
    timestamp_min: 120
    affected_vehicle: "VEH_COLD_01"
    variation_classification: "SEMANTIC_VARIATION"
