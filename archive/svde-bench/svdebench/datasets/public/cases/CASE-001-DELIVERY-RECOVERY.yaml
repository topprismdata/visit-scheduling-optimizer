# Golden Case 001 — Dynamic Delivery Failure Recovery v0.1 (Immutable Artifact)
metadata:
  id: "CASE-001-DELIVERY-RECOVERY"
  domain: "Dynamic Fleet Route Logistics"
  name: "Dynamic Delivery Failure Recovery v0.1"
  created_at: "2026-08-22"
  tags: ["dynamic", "breakdown", "commitment_preservation", "golden_case"]

intent:
  objective: "Protect customer commitments with priority over local transportation cost minimization"
  priority_rule: "COMMITMENT_FIRST"

world_state:
  depot: [0, 0]
  fleet:
    - {id: "VEH_01", type: "COLD_REFRIGERATED", capacity_kg: 1000, status: "EN_ROUTE"}
    - {id: "VEH_02", type: "STANDARD_VAN",      capacity_kg: 1000, status: "EN_ROUTE"}
    - {id: "VEH_03", type: "STANDARD_VAN",      capacity_kg: 800,  status: "EN_ROUTE"}
  orders:
    - {id: "ORD_01", weight_kg: 200, req_cold: true,  tw_early: 60,  tw_late: 180, is_locked: false}
    - {id: "ORD_02", weight_kg: 300, req_cold: false, tw_early: 60,  tw_late: 240, is_locked: false}
    - {id: "ORD_03", weight_kg: 250, req_cold: false, tw_early: 120, tw_late: 200, is_locked: true, is_vip: true}
    - {id: "ORD_04", weight_kg: 150, req_cold: true,  tw_early: 180, tw_late: 360, is_locked: false}
    - {id: "ORD_06", weight_kg: 200, req_cold: false, tw_early: 240, tw_late: 480, is_locked: false}

semantic_contract:
  constraints:
    - id: "C1"
      name: "VehicleCapacity"
      type: "VEHICLE_CAPACITY"
      hardness: "HARD"
      relaxable: false
    - id: "C3"
      name: "ColdChainMatch"
      type: "COLD_CHAIN_MATCH"
      hardness: "HARD"
      relaxable: false
    - id: "C4"
      name: "TimeWindowLock_ORD03"
      type: "TIME_WINDOW_LOCKED"
      hardness: "HARD_COMMITMENT"
      target_order: "ORD_03"
      locked_window: [120, 200]
      relaxable: false
    - id: "C7"
      name: "MinimalRerouteDisruption"
      type: "MINIMAL_DISRUPTION"
      hardness: "SOFT_PREFERENCE"
      relaxable: true
  invariants:
    - "I1_ExecutedFactImmutability"
    - "I2_CommitmentPreservation"

runtime_context:
  timestamp_min: 180
  past_delivered_orders:
    - {order_id: "ORD_01", delivered_by: "VEH_01", delivered_at_min: 110}
    - {order_id: "ORD_02", delivered_by: "VEH_02", delivered_at_min: 130}
  active_unfulfilled_orders: ["ORD_03", "ORD_04", "ORD_06"]

events:
  - event_id: "EVT_001"
    event_type: "VEHICLE_MECHANICAL_BREAKDOWN"
    timestamp_min: 180
    affected_vehicle: "VEH_02"
    variation_classification: "SEMANTIC_VARIATION"
