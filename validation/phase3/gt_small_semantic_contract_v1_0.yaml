## §2 Decision Feasibility 判据（DSVL 前置检查的规范——KB-GOV-016）

模型编译后必须满足的**决策级不变式**（区别于 solver 可行性）：
1. **I1 锁不变式**：GS-CMT-1..4 在模型中各有执法元素（变量固定/顺序约束），缺一即 Decision Infeasible
2. **I2 频次不变式**：HARD 频次（C1/C2-lo）在非 soft Case 中为等式/下界约束——不得以罚项形式出现
3. **I3 软化白名单**：仅 Case2 且仅频次维度可软化（C1→C2 形态）；C4/C6/C7/C8/C9/C10 任何 Case 下 relaxable=false
4. **I4 口径唯一**：L5 的 service 仅含 expected_service_min；stop_time 证据不进入（AC-8）
5. **I5 trace 双射**：每个 Typed Constraint ↔ 数学元素 ↔ Domain 对象三链闭合（KG 图谱数学投影）

