# 生成期检查规则（Type Check Rules WH-TC-001..004）
# ═══════════════════════════════════════════════════════════════
type_check_rules:
  - id: WH-TC-001
    name: HardSafetyNeverSoft
    rule: "WC04 (Temp) / WC05 (Hazmat) / WC06 (Heavy) 的 hardness 恒为 HARD，relaxable 恒为 false；任何软化企图立即报 TYPE_ERROR"
  - id: WH-TC-002
    name: SingleSKUOccupancy
    rule: "WC03 的 cardinality.op 必须为 '<=' 且 value 必须为 1（独占货位策略）"
  - id: WH-TC-003
    name: ObjectiveIsolation
    rule: "WC07 (Pick Cost) 必须且仅能居于 OBJECTIVE 空间，禁止作为 HARD 约束编译"
  - id: WH-TC-004
    name: HazmatExclusionValidation
    rule: "危化品排他点对集非空验证：检查是否存在物理距离不足 15 的危险货位配对并显式生成排他对"
